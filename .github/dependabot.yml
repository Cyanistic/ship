version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  # the agents the demo tapes record with; review a bump by watching the next take
  - package-ecosystem: npm
    directory: /website/tapes
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      demo-agents:
        patterns: ["*"]
