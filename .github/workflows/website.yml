name: Website

# The site is served at https://shipmux.github.io/ship/, so it is built with the base path /ship/. Pushes to main
# and published releases deploy every docs version (one copy per v* tag). Pull requests only build the site.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/site/**
      - .github/workflows/website.yml
  # release-plz publishes releases with the ship-crewmate token, which is what lets this run (as in release.yml)
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - website/**
      - docs/site/**
      - .github/workflows/website.yml

permissions:
  contents: read

env:
  SHIP_BASE: /ship/
  SHIP_SITE_URL: https://shipmux.github.io/ship

jobs:
  # Plain build of the site on a pull request, with the production base so a base-path mistake shows up here.
  check:
    name: Build the site
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the pnpm version comes from the packageManager field; there is no package.json at the repo root
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
      # cached here because this job publishes nothing (the deploy build below skips the cache)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm # zizmor: ignore[cache-poisoning]
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - run: pnpm format:check
        working-directory: website
      - run: pnpm check
        working-directory: website
      - run: pnpm build
        working-directory: website

  # One Astro build per docs version, merged into a single folder for Pages.
  build:
    name: Build the versioned site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build-versions.mjs reads every v* tag, and origin/main, so the full history and tags are needed
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
      # no cache in a job that publishes: a cache entry saved by any other job would flow into the deployed site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        working-directory: website
      # origin/main, not main: a release or manual run may have no local main branch
      - run: node scripts/build-versions.mjs .. dist --main origin/main
        working-directory: website
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one deployment at a time, and an older one is never cancelled half way
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
