name: Website

# The site is served at https://shipmux.github.io/ship/, so it is built with the base path /ship/. Pushes to main
# and published releases deploy every docs version (one copy per v* tag). Pull requests only build the site.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/site/**
      - .github/workflows/website.yml
  # release-plz publishes releases with the ship-crewmate token, which is what lets this run (as in release.yml)
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - website/**
      - docs/site/**
      - .github/workflows/website.yml

permissions:
  contents: read

env:
  SHIP_BASE: /ship/
  SHIP_SITE_URL: https://shipmux.github.io/ship

jobs:
  # Plain build of the site on a pull request, with the production base so a base-path mistake shows up here.
  check:
    name: Build the site
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the pnpm version comes from the packageManager field; there is no package.json at the repo root
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
      # cached here because this job publishes nothing (the deploy build below skips the cache)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm # zizmor: ignore[cache-poisoning]
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - run: pnpm format:check
        working-directory: website
      - run: pnpm check
        working-directory: website
      - run: pnpm build
        working-directory: website

  # Records the demo videos (website/tapes) with real Claude Code and pi on OpenRouter's free models. Only
  # releases and manual runs record. Takes vary from run to run, and a take that fails falls back to the copy
  # already on the site (see the build job).
  demo:
    name: Record the demo videos
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # record.sh builds ship, which needs the toolchain from rust-toolchain.toml and Zig for libghostty-vt-sys.
      # No Rust or Zig cache in a job whose output is published.
      - run: rustup toolchain install
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      # Noto covers the symbols claude draws that JetBrains Mono lacks (⏵⏵ before "don't ask on", its
      # spinners), which otherwise render as boxes. pi warns on screen when it can't find fd (it accepts
      # Ubuntu's fdfind) or rg, and the tapes run it offline, so it can't download them.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev fonts-noto-core fd-find ripgrep
      # with no tape path it only installs VHS, ttyd, ffmpeg and JetBrains Mono, which the tapes use
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          version: v0.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # claude and pi at the versions website/tapes/package-lock.json pins; a new agent version can change
      # what a take looks like
      - run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
        working-directory: website/tapes
      - name: Record waterline
        continue-on-error: true
        run: OUT="$RUNNER_TEMP/demo" website/tapes/record.sh waterline.tape --openrouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Record relay
        continue-on-error: true
        run: OUT="$RUNNER_TEMP/demo" website/tapes/record.sh relay.tape --openrouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo
          path: |
            ${{ runner.temp }}/demo/*.webm
            ${{ runner.temp }}/demo/*.png
          if-no-files-found: ignore

  # One Astro build per docs version, merged into a single folder for Pages.
  build:
    name: Build the versioned site
    # after demo, or without it when it is skipped (pushes) or fails
    needs: demo
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build-versions.mjs reads every v* tag, and origin/main, so the full history and tags are needed
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
      # no cache in a job that publishes: a cache entry saved by any other job would flow into the deployed site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        working-directory: website
      # origin/main, not main: a release or manual run may have no local main branch
      - run: node scripts/build-versions.mjs .. dist --main origin/main
        working-directory: website
      # the demo job's takes, when this run recorded any
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: demo
          path: ${{ runner.temp }}/demo
      # Renders are never committed, so each file comes from this run's take or else from the live site.
      - name: Add the demo videos
        working-directory: website
        run: |
          mkdir -p dist/demo
          for f in waterline.webm waterline.png relay.webm relay.png; do
            if [ -f "$RUNNER_TEMP/demo/$f" ]; then
              cp "$RUNNER_TEMP/demo/$f" dist/demo/
            elif ! curl -fsSLo "dist/demo/$f" "$SHIP_SITE_URL/demo/$f"; then
              rm -f "dist/demo/$f"
              echo "::warning::no $f: no take this run and none on the live site"
            fi
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    # Only main and releases publish. A manual run on another branch stops at the build job, whose Pages
    # artifact can be downloaded to preview the site. Without a status check of its own this job would be
    # skipped whenever demo is (every push), since the implicit success() looks through build to demo.
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'release') }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one deployment at a time, and an older one is never cancelled half way
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
