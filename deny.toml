[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# Every license here is compatible with Ship's GPL-3.0-or-later. Add a new one
# only after checking that it is.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/uzaaft/libghostty-rs"]
