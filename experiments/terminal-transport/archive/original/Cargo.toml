[package]
name = "ship-jsonpatch-prototype"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
ratatui-ghostty = "=0.2.0"
ratatui = { version = "=0.30.0", features = ["serde"] }
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "=4.2.0"
flate2 = "1"
zstd = "0.13"
structdiff = { version = "=0.7.3", features = ["serde"] }

# Read-only existing wrappers and bindings, pinned checkout:
# 8953a740bc378cec3e07e1f6ca949f0595eab19b.
[patch.crates-io]
ratatui-ghostty = { path = "/private/tmp/ship-screen-prototype/wrapper-compat" }
libghostty-vt = { path = "/private/tmp/ship-screen-prototype/libghostty-rs/crates/libghostty-vt" }
libghostty-vt-sys = { path = "/private/tmp/ship-screen-prototype/libghostty-rs/crates/libghostty-vt-sys" }
