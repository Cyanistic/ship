[package]
name = "ship-jsonpatch-prototype"
version = "0.0.0"
edition = "2024"

[workspace]
# Keep path dependencies out of this workspace so bindings inherit their own
# vendored workspace.package settings, not this experiment's settings.
exclude = ["vendor/wrapper-compat", "vendor/libghostty-rs", "vendor/libghostty-rs/crates/*"]

[dependencies]
ratatui-ghostty = "=0.2.0"
ratatui = { version = "=0.30.0", features = ["serde"] }
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "=4.2.0"
flate2 = "1"
zstd = "0.13"
structdiff = { version = "=0.7.3", features = ["serde"] }

# Preserved experimental wrapper and bindings. Exact pins and patches:
# vendor/PROVENANCE.md. Not production dependencies.
[patch.crates-io]
ratatui-ghostty = { path = "vendor/wrapper-compat" }
libghostty-vt = { path = "vendor/libghostty-rs/crates/libghostty-vt" }
libghostty-vt-sys = { path = "vendor/libghostty-rs/crates/libghostty-vt-sys" }
